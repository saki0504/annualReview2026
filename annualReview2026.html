<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>40个问题回顾一年 · 2026</title>
<style>
  :root{
    --bg:#f6f3ee;--panel:#ffffff;--ink:#23282d;--ink-soft:#7c8391;
    --line:#e6e0d6;--accent:#c2603f;--accent-soft:#fbeee8;
    --ok:#3d8b6f;--warn:#c98a2b;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden;
  }
  button{font-family:inherit;}
  .app{display:flex;height:100vh;height:100dvh;overflow:hidden;}

  /* 侧边栏 */
  .sidebar{width:330px;flex:0 0 330px;height:100%;background:var(--panel);
    border-right:1px solid var(--line);display:flex;flex-direction:column;}
  .brand{padding:22px 20px 16px;border-bottom:1px solid var(--line);}
  .brand-title{font-size:16px;font-weight:700;letter-spacing:.4px;}
  .brand-year{font-size:10px;font-weight:700;color:var(--accent);letter-spacing:2px;margin-top:6px;}
  .progress{margin-top:14px;}
  .progress-bar{height:5px;border-radius:99px;background:#efe9e0;overflow:hidden;}
  .progress-fill{height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,#e0916f,#c2603f);transition:width .35s ease;}
  .progress-text{font-size:11px;color:var(--ink-soft);margin-top:7px;}

  .nav{flex:1;overflow-y:auto;padding:6px 10px 40px;}
  .nav::-webkit-scrollbar{width:8px;}
  .nav::-webkit-scrollbar-thumb{background:#e2dbd0;border-radius:8px;}
  .part-title{font-size:10.5px;font-weight:700;letter-spacing:1.4px;color:#a49b8c;
    padding:18px 10px 8px;text-transform:uppercase;}
  .nav-item{display:flex;gap:10px;align-items:flex-start;width:100%;
    padding:9px 10px;margin-bottom:2px;border:none;background:none;border-radius:10px;
    cursor:pointer;text-align:left;color:var(--ink);font-size:13px;line-height:1.45;
    transition:background .15s,color .15s;}
  .nav-item:hover{background:#f5f1ea;}
  .nav-item .num{flex:0 0 22px;height:22px;border-radius:50%;background:#f1ece4;
    color:#9a9184;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;margin-top:1px;transition:.15s;}
  .nav-item .txt{flex:1;min-width:0;overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .nav-item.active{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(194,96,63,.28);}
  .nav-item.active .num{background:rgba(255,255,255,.25);color:#fff;}
  .nav-item.filled:not(.active) .num{background:var(--accent-soft);color:var(--accent);}
  .nav-item.filled:not(.active) .txt{font-weight:600;}

  /* 主区 */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;}
  .mobile-bar{display:none;}
  .content{flex:1;overflow-y:auto;padding:44px 48px 40px;scroll-behavior:smooth;}
  .content::-webkit-scrollbar{width:10px;}
  .content::-webkit-scrollbar-thumb{background:#e2dbd0;border-radius:8px;}
  .content-inner{max-width:800px;margin:0 auto;}

  .q-part{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1.6px;
    color:var(--accent);background:var(--accent-soft);padding:5px 12px;border-radius:99px;}
  .q-text{font-size:27px;line-height:1.45;font-weight:700;letter-spacing:.3px;
    margin:18px 0 0;color:var(--ink);}
  .q-num{color:var(--accent);margin-right:4px;}

  .block{margin-top:26px;background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:18px 18px 20px;box-shadow:0 1px 2px rgba(30,25,20,.03);}
  .block-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .block-head h3{margin:0;font-size:14px;font-weight:700;letter-spacing:.3px;}
  .hint{font-size:12px;color:var(--ink-soft);}

  .dropzone{border:2px dashed var(--line);border-radius:14px;padding:26px 16px;
    text-align:center;color:var(--ink-soft);font-size:13px;cursor:pointer;
    transition:.18s;user-select:none;}
  .dropzone:hover,.dropzone.dragover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
  .dz-icon{font-size:22px;line-height:1;margin-bottom:8px;font-weight:300;}

  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));
    gap:10px;margin-top:14px;}
  .gallery:empty{display:none;}
  .thumb{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;
    background:#f0ece5;animation:pop .2s ease;}
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;}
  .thumb .del{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;
    border:none;background:rgba(0,0,0,.55);color:#fff;font-size:15px;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:.15s;}
  .thumb:hover .del{opacity:1;}
  .thumb .del:hover{background:#c0392b;}

  textarea{width:100%;min-height:250px;border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;background:#fcfbf9;color:var(--ink);font-family:inherit;
    font-size:15px;line-height:1.8;resize:vertical;outline:none;transition:.18s;}
  textarea::placeholder{color:#b6b0a6;}
  textarea:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(194,96,63,.1);}

  /* 底部操作条 */
  .footer-bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    gap:14px;padding:14px 48px;border-top:1px solid var(--line);
    background:rgba(255,255,255,.82);backdrop-filter:blur(10px);}
  .status{font-size:13px;color:var(--ink-soft);transition:color .2s;}
  .status.dirty{color:var(--warn);}
  .status.saved{color:var(--ok);}
  .status.err{color:#c0392b;}
  .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

  .ghost-btn{background:#fff;color:var(--ink);border:1px solid var(--line);
    padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;
    cursor:pointer;transition:.18s;white-space:nowrap;}
  .ghost-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}

  .save-btn{background:var(--accent);color:#fff;border:none;padding:11px 34px;
    border-radius:99px;font-size:14px;font-weight:600;letter-spacing:1px;
    cursor:pointer;transition:.18s;box-shadow:0 6px 18px rgba(194,96,63,.28);white-space:nowrap;}
  .save-btn:hover{filter:brightness(1.07);transform:translateY(-1px);}
  .save-btn:active{transform:translateY(0);}

  .lightbox{position:fixed;inset:0;z-index:200;background:rgba(18,16,14,.9);
    display:flex;align-items:center;justify-content:center;padding:28px;
    cursor:zoom-out;animation:fade .18s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .lightbox img{max-width:100%;max-height:100%;border-radius:10px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);}

  .drawer-overlay{display:none;position:fixed;inset:0;background:rgba(20,18,16,.42);
    z-index:49;opacity:0;transition:opacity .25s;}

  @media (max-width:900px){
    .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:50;width:290px;
      flex-basis:290px;transform:translateX(-100%);transition:transform .26s ease;
      box-shadow:6px 0 30px rgba(0,0,0,.12);}
    .sidebar.open{transform:translateX(0);}
    .drawer-overlay.show{display:block;opacity:1;}
    .mobile-bar{display:flex;align-items:center;gap:12px;padding:12px 16px;
      border-bottom:1px solid var(--line);background:rgba(255,255,255,.9);
      backdrop-filter:blur(10px);font-size:14px;font-weight:600;flex:0 0 auto;}
    .menu-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
      background:#fff;color:var(--ink);display:flex;align-items:center;
      justify-content:center;cursor:pointer;padding:0;}
    .content{padding:24px 18px 30px;}
    .q-text{font-size:20px;}
    .footer-bar{padding:12px 18px;flex-wrap:wrap;}
    .status{width:100%;}
    .actions{width:100%;justify-content:space-between;}
    .block{padding:15px 15px 17px;border-radius:14px;}
    textarea{min-height:200px;font-size:16px;}
    .save-btn{padding:10px 22px;}
    .ghost-btn{padding:9px 14px;font-size:12px;}
    .thumb .del{opacity:1;}
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-title">40 个问题回顾一年</div>
      <div class="brand-year">YEAR REVIEW · 2026</div>
      <div class="progress">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">已填写 0 / 40</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <div class="drawer-overlay" id="drawerOverlay"></div>

  <main class="main">
    <div class="mobile-bar">
      <button class="menu-btn" id="menuBtn" aria-label="打开问题列表">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <span>2026 年度回顾</span>
    </div>

    <div class="content" id="content"></div>

    <div class="footer-bar">
      <span class="status" id="status"></span>
      <div class="actions">
        <button class="ghost-btn" id="importBtn">导入</button>
        <button class="ghost-btn" id="exportBtn">导出答案</button>
        <button class="ghost-btn" id="shareBtn">生成分享页</button>
        <button class="save-btn" id="saveBtn">保 存</button>
        <input type="file" id="importInput" accept="application/json,.json" hidden>
      </div>
    </div>
  </main>
</div>

<script>
/* ============ 题库 ============ */
const PARTS = [
  { title:'Part 1 · 体验与足迹', items:[
    '2026年，你解锁了哪些人生第一次？',
    '今年去过哪些新的城市或国家？最喜欢哪里？',
    '如果可以重过今年的某一天，你会选择哪一天？',
    '今年做过最疯狂、最大胆的一件事是什么？',
    '今年有没有一个瞬间，让你忍不住感叹“今天真是美好的一天”？',
    '今年拍过最满意的一张照片是什么？',
    '有没有一件原本不抱期待，结果却出乎意料地美好的事情？',
    '今年有什么事情，让你笑到停不下来？',
    '今年完成了哪件一直想做、却迟迟没有行动的小事？',
    '如果要给2026年的旅行或日常选一个最佳目的地，你会选哪里？'
  ]},
  { title:'Part 2 · 好物与日常', items:[
    '今年吃过最好吃的一顿饭是什么？在哪里？',
    '2026年，有没有一种食物让你反复想吃？',
    '今年买过最满意的一样东西是什么？',
    '今年最后悔的一笔消费是什么？',
    '今年最喜欢的一件衣服或一个穿搭是什么？',
    '2026年的年度单曲是哪一首？',
    '今年看过最喜欢的电影、电视剧或综艺是什么？',
    '今年发现了哪一家值得推荐的宝藏小店？',
    '有没有突然迷上的新爱好、新运动或新事物？',
    '今年有什么小东西虽然不贵，却给你带来了很多快乐？'
  ]},
  { title:'Part 3 · 人与陪伴', items:[
    '今年新认识的人里，谁让你印象最深？',
    '今年和朋友一起做过最开心的一件事是什么？',
    '有没有一个偶然认识的人，后来成为了你生活里很重要的存在？',
    '今年收到过最喜欢的一份礼物是什么？',
    '有没有一句别人对你说的话，让你记到了现在？',
    '今年谁最常出现在你的聊天记录里？',
    '今年有没有一场让你难忘的重逢？',
    '今年你最想感谢的人是谁？',
    '今年有没有和某个人完成一件期待已久的事情？',
    '今年有没有哪个瞬间，让你觉得“有人陪伴真好”？'
  ]},
  { title:'Part 4 · 自我与未来', items:[
    '今年坚持最久的一件事情是什么？',
    '有没有发现自己比以前更擅长做某件事了？',
    '今年最为自己感到骄傲的一刻是什么？',
    '今年养成了什么新习惯，或者改掉了什么旧习惯？',
    '今年有没有一件没做成、但依然很想完成的事情？',
    '2026年，有没有什么年初特别想要，现在却不想要了？',
    '如果给2026年的自己颁一个奖，会是什么奖？',
    '2027年最想去哪里、最想尝试什么？',
    '如果要给2026年选三个关键词，你会选什么？',
    '这一年，你最舍不得忘记的是什么？'
  ]}
];

const QUESTIONS = [];
PARTS.forEach(part => part.items.forEach(text => {
  QUESTIONS.push({ id:'q'+(QUESTIONS.length+1), num:QUESTIONS.length+1,
    partTitle:part.title, text });
}));

/* ============ 存储 ============ */
const DB_NAME='YearReview2026', DB_VERSION=1, STORE='answers';
let db=null, usingIDB=false;

function openDB(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)) return reject(new Error('no idb'));
    let settled=false;
    const timer=setTimeout(()=>{ if(!settled){settled=true;reject(new Error('timeout'));} },4000);
    let req;
    try{ req=indexedDB.open(DB_NAME,DB_VERSION); }catch(e){ clearTimeout(timer); return reject(e); }
    req.onupgradeneeded=()=>{ const d=req.result;
      if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE); };
    req.onsuccess=()=>{ if(settled){req.result.close();return;}
      settled=true;clearTimeout(timer);resolve(req.result); };
    req.onerror=()=>{ if(settled)return; settled=true;clearTimeout(timer);reject(req.error); };
  });
}
async function initStore(){
  try{ db=await openDB(); usingIDB=true; }
  catch(e){ console.warn('IndexedDB 不可用，改用 localStorage',e); usingIDB=false; }
}
const lsKey = id => 'yr26:' + id;
function lsGet(id){
  try{ const raw=localStorage.getItem(lsKey(id)); return raw?JSON.parse(raw):null; }
  catch(e){ return null; }
}
function storeGet(id){
  return new Promise(resolve=>{
    if(usingIDB && db){
      try{
        const tx=db.transaction(STORE,'readonly');
        const req=tx.objectStore(STORE).get(id);
        req.onsuccess=()=>resolve(req.result||null);
        req.onerror=()=>resolve(lsGet(id));
      }catch(e){ resolve(lsGet(id)); }
    } else resolve(lsGet(id));
  });
}
function storeSet(id,val){
  return new Promise((resolve,reject)=>{
    if(usingIDB && db){
      try{
        const tx=db.transaction(STORE,'readwrite');
        tx.objectStore(STORE).put(val,id);
        tx.oncomplete=()=>resolve();
        tx.onerror=()=>reject(tx.error);
        tx.onabort=()=>reject(tx.error||new Error('中断'));
      }catch(e){ reject(e); }
    } else {
      try{ localStorage.setItem(lsKey(id),JSON.stringify(val)); resolve(); }
      catch(e){ reject(e); }
    }
  });
}

/* ============ 状态 ============ */
const state={ currentId:null, data:{} };
const dirtyVersion={}, savedVersion={};
let saveTimer=null;

const navEl=document.getElementById('nav');
const contentEl=document.getElementById('content');
const statusEl=document.getElementById('status');
const saveBtn=document.getElementById('saveBtn');
const progressFill=document.getElementById('progressFill');
const progressText=document.getElementById('progressText');
const sidebar=document.getElementById('sidebar');
const drawerOverlay=document.getElementById('drawerOverlay');
const menuBtn=document.getElementById('menuBtn');
const exportBtn=document.getElementById('exportBtn');
const importBtn=document.getElementById('importBtn');
const importInput=document.getElementById('importInput');
const shareBtn=document.getElementById('shareBtn');

/* ============ 工具 ============ */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const hasContent = d => !!(d && ((d.text && d.text.trim()) || (d.images && d.images.length)));
const isDirty = id => (dirtyVersion[id]||0) !== (savedVersion[id]||0);
function setStatus(kind,text){
  if(kind==='custom'){ statusEl.textContent=text; statusEl.className='status'; return; }
  const map={ unsaved:['未保存的修改…','dirty'], saving:['保存中…',''],
    saved:['已保存 ✓','saved'], error:['保存失败，请重试','err'],
    empty:['还没有内容，写下你的答案吧',''], processing:['正在处理图片…',''] };
  const [t,c]=map[kind]||['',''];
  statusEl.textContent=t; statusEl.className='status '+c;
}

/* ============ 图片 ============ */
function compressImage(file,maxSize=1600,quality=0.85){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.naturalWidth,h=img.naturalHeight;
        if(Math.max(w,h)>maxSize){ const s=maxSize/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        try{ resolve(c.toDataURL('image/jpeg',quality)); }catch(e){ reject(e); }
      };
      img.onerror=()=>reject(new Error('解码失败'));
      img.src=reader.result;
    };
    reader.onerror=()=>reject(new Error('读取失败'));
    reader.readAsDataURL(file);
  });
}
function openLightbox(src){
  const box=document.createElement('div'); box.className='lightbox';
  const img=document.createElement('img'); img.src=src; box.appendChild(img);
  box.addEventListener('click',()=>box.remove());
  document.body.appendChild(box);
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ const lb=document.querySelector('.lightbox'); if(lb)lb.remove(); closeDrawer(); }
});

/* ============ 导航 ============ */
function renderNav(){
  navEl.innerHTML='';
  PARTS.forEach(part=>{
    const title=document.createElement('div');
    title.className='part-title'; title.textContent=part.title;
    navEl.appendChild(title);
    QUESTIONS.filter(q=>q.partTitle===part.title).forEach(q=>{
      const btn=document.createElement('button');
      btn.className='nav-item'; btn.dataset.id=q.id;
      btn.innerHTML=`<span class="num">${q.num}</span><span class="txt">${escapeHtml(q.text)}</span>`;
      btn.addEventListener('click',()=>{ selectQuestion(q.id); closeDrawer(); });
      navEl.appendChild(btn);
    });
  });
}
function updateNavActive(){
  navEl.querySelectorAll('.nav-item').forEach(el=>{
    el.classList.toggle('active',el.dataset.id===state.currentId);
  });
}
function updateNavFilled(id){
  const el=navEl.querySelector(`.nav-item[data-id="${id}"]`);
  if(el) el.classList.toggle('filled',hasContent(state.data[id]));
}
function updateProgress(){
  const n=QUESTIONS.filter(q=>hasContent(state.data[q.id])).length;
  progressText.textContent=`已填写 ${n} / ${QUESTIONS.length}`;
  progressFill.style.width=(n/QUESTIONS.length*100)+'%';
}

/* ============ 内容渲染 ============ */
function renderContent(){
  const q=QUESTIONS.find(x=>x.id===state.currentId);
  if(!q) return;
  const d=state.data[q.id];

  contentEl.innerHTML=`
    <div class="content-inner">
      <div class="q-header">
        <span class="q-part">${escapeHtml(q.partTitle)}</span>
        <h2 class="q-text"><span class="q-num">${q.num}.</span>${escapeHtml(q.text)}</h2>
      </div>
      <section class="block">
        <div class="block-head">
          <h3>📷 照片</h3>
          <span class="hint">支持多张图片 · 点击可放大</span>
        </div>
        <div class="dropzone" id="dropzone">
          <input type="file" id="fileInput" accept="image/*" multiple hidden>
          <div class="dz-icon">＋</div>
          <div>点击选择图片，或把图片拖到这里</div>
        </div>
        <div class="gallery" id="gallery"></div>
      </section>
      <section class="block">
        <div class="block-head">
          <h3>✍️ 回答</h3>
          <span class="hint" id="charCount">0 字</span>
        </div>
        <textarea id="answerInput" placeholder="写下你的答案……（切换问题时内容会自动保存）"></textarea>
      </section>
    </div>`;

  const ta=document.getElementById('answerInput');
  const charCount=document.getElementById('charCount');
  ta.value=d.text||'';
  const updateCount=()=>{ charCount.textContent=ta.value.length+' 字'; };
  updateCount();
  ta.addEventListener('input',()=>{ d.text=ta.value; updateCount(); markDirty(); });

  const gallery=document.getElementById('gallery');
  const dropzone=document.getElementById('dropzone');
  const fileInput=document.getElementById('fileInput');

  renderGallery(d,gallery);
  dropzone.addEventListener('click',()=>fileInput.click());
  fileInput.addEventListener('change',async()=>{
    await handleFiles(fileInput.files,d,gallery); fileInput.value='';
  });
  ['dragenter','dragover'].forEach(evt=>dropzone.addEventListener(evt,e=>{
    e.preventDefault(); e.stopPropagation(); dropzone.classList.add('dragover');
  }));
  ['dragleave','dragend'].forEach(evt=>dropzone.addEventListener(evt,e=>{
    e.preventDefault(); e.stopPropagation(); dropzone.classList.remove('dragover');
  }));
  dropzone.addEventListener('drop',async e=>{
    e.preventDefault(); e.stopPropagation();
    dropzone.classList.remove('dragover');
    await handleFiles(e.dataTransfer.files,d,gallery);
  });
  contentEl.scrollTop=0;
}

/* ★ 关键修复：用 src 精确定位删除，不再依赖索引 */
function renderGallery(d,gallery){
  gallery.innerHTML='';
  d.images.forEach((src)=>{
    const thumb=document.createElement('div');
    thumb.className='thumb';

    const img=document.createElement('img');
    img.src=src;
    img.alt='照片';
    img.addEventListener('click',()=>openLightbox(src));

    const del=document.createElement('button');
    del.className='del';
    del.type='button';
    del.textContent='×';
    del.title='删除这张图片';
    del.addEventListener('click',e=>{
      e.stopPropagation();
      e.preventDefault();
      if(!confirm('确定删除这张图片吗？')) return;

      const idx = d.images.indexOf(src);
      if(idx > -1){
        d.images.splice(idx, 1);
      }
      renderGallery(d, gallery);
      markDirty();
    });

    thumb.appendChild(img);
    thumb.appendChild(del);
    gallery.appendChild(thumb);
  });
}

async function handleFiles(fileList,d,gallery){
  const files=Array.from(fileList||[]).filter(f=>f.type&&f.type.startsWith('image/'));
  if(!files.length) return;
  setStatus('processing');
  for(const f of files){
    try{ d.images.push(await compressImage(f)); }
    catch(err){ console.error('图片处理失败',err); }
  }
  renderGallery(d,gallery); markDirty();
}

/* ============ 保存 ============ */
function markDirty(){
  const id=state.currentId; if(!id) return;
  dirtyVersion[id]=(dirtyVersion[id]||0)+1;
  setStatus('unsaved'); scheduleSave();
}
function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>saveCurrent(),1200); }

async function saveCurrent(){
  const id=state.currentId; if(!id) return;
  clearTimeout(saveTimer);
  const v=dirtyVersion[id]||0;
  if(v===(savedVersion[id]||0)){ setStatus('saved'); return; }
  setStatus('saving');
  try{
    await storeSet(id,state.data[id]);
    savedVersion[id]=v;
    updateNavFilled(id); updateProgress();
    if(state.currentId===id){
      setStatus(isDirty(id)?'unsaved':'saved');
    }
  }catch(err){
    console.error('保存失败',err);
    if(state.currentId===id){ statusEl.textContent='保存失败：存储空间可能已满'; statusEl.className='status err'; }
  }
}
saveBtn.addEventListener('click',async()=>{
  saveBtn.textContent='保存中…'; await saveCurrent();
  setTimeout(()=>saveBtn.textContent='保 存',400);
});

/* ============ 切换问题 ============ */
async function selectQuestion(id){
  if(state.currentId===id) return;
  if(state.currentId && isDirty(state.currentId)) await saveCurrent();
  state.currentId=id;
  renderContent(); updateNavActive();
  if(isDirty(id)) setStatus('unsaved');
  else if(hasContent(state.data[id])) setStatus('saved');
  else setStatus('empty');
}

/* ============ 导出 JSON ============ */
exportBtn.addEventListener('click',async()=>{
  if(state.currentId && isDirty(state.currentId)) await saveCurrent();
  const payload={ app:'year-review-2026', exportedAt:new Date().toISOString(), answers:{} };
  let count=0;
  QUESTIONS.forEach(q=>{
    const d=state.data[q.id];
    if(hasContent(d)){
      payload.answers[q.id]={ num:q.num, question:q.text, text:d.text||'', images:d.images||[] };
      count++;
    }
  });
  if(!count){ alert('还没有填写任何内容哦～'); return; }
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='2026年度回顾_'+new Date().toLocaleDateString('zh-CN').replace(/\//g,'-')+'.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  setStatus('custom','已导出 '+count+' 条回答，发给对方即可');
  statusEl.className='status saved';
});

/* ============ 导入 JSON ============ */
importBtn.addEventListener('click',()=>importInput.click());
importInput.addEventListener('change',async()=>{
  const file=importInput.files[0];
  importInput.value='';
  if(!file) return;
  try{
    const text=await file.text();
    const payload=JSON.parse(text);
    if(!payload || !payload.answers || typeof payload.answers!=='object')
      throw new Error('文件格式不正确');
    const entries=Object.entries(payload.answers);
    if(!entries.length) throw new Error('文件里没有回答');

    if(!confirm(`即将导入 ${entries.length} 条回答，会覆盖本机对应题目的现有内容。继续吗？`)) return;

    let count=0;
    for(const [id,ans] of entries){
      if(!state.data[id]) continue;
      state.data[id].text = typeof ans.text==='string' ? ans.text : '';
      state.data[id].images = Array.isArray(ans.images) ? ans.images.filter(x=>typeof x==='string') : [];
      dirtyVersion[id]=(dirtyVersion[id]||0)+1;
      await storeSet(id,state.data[id]);
      savedVersion[id]=dirtyVersion[id];
      updateNavFilled(id);
      count++;
    }
    updateProgress();
    if(state.currentId) renderContent();
    setStatus('custom','已导入 '+count+' 条回答');
    statusEl.className='status saved';
    alert('导入成功，共 '+count+' 条回答');
  }catch(err){
    console.error(err);
    alert('导入失败：'+err.message);
  }
});
